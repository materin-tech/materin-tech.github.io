<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小游戏中心 · Mini Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231e6fd9'/></svg>" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 80% at 50% 0%, #16233a, #0a0e16 70%);
    color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 8vh 16px 48px;
  }
  h1 { font-size: clamp(26px, 6vw, 44px); letter-spacing: .12em; margin-bottom: .4em; }
  .sub { color: rgba(255,255,255,.55); font-size: clamp(12px, 3vw, 16px); margin-bottom: 40px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px; width: 100%; max-width: 860px;
  }
  a.card {
    display: flex; align-items: center; gap: 16px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    padding: 18px 20px;
    color: #fff; text-decoration: none;
    transition: transform .15s, background .15s;
  }
  a.card:hover { transform: translateY(-3px); background: rgba(255,255,255,.1); }
  a.card:active { transform: scale(.97); }
  .icon {
    width: 52px; height: 52px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .icon.tetris { background: linear-gradient(135deg, #42a5f5, #1e6fd9); }
  .icon.snake  { background: linear-gradient(135deg, #66bb6a, #2e7d32); }
  .icon.g2048  { background: linear-gradient(135deg, #ffca28, #f57f17); }
  .icon.g1024  { background: linear-gradient(135deg, #4dd0e1, #00838f); }
  .card b { font-size: 17px; display: block; }
  .card span { font-size: 13px; color: rgba(255,255,255,.5); }
  .soon {
    display: flex; align-items: center; gap: 16px;
    border: 1px dashed rgba(255,255,255,.15);
    border-radius: 16px; padding: 18px 20px;
    color: rgba(255,255,255,.35); font-size: 14px;
  }
  footer { margin-top: auto; padding-top: 48px; font-size: 12px; color: rgba(255,255,255,.3); }
</style>
</head>
<body>
  <h1>小游戏中心</h1>
  <p class="sub">Three.js 休闲小游戏合集 · 手机竖屏适配</p>
  <div class="grid">
    <a class="card" href="./tetris/">
      <div class="icon tetris">🧱</div>
      <div><b>俄罗斯方块</b><span>经典消行 · 等级加速</span></div>
    </a>
    <a class="card" href="./snake/">
      <div class="icon snake">🐍</div>
      <div><b>贪吃蛇</b><span>吃苹果成长 · 越来越快</span></div>
    </a>
    <a class="card" href="./2048/">
      <div class="icon g2048">🔢</div>
      <div><b>2048</b><span>滑动合并 · 冲击 2048</span></div>
    </a>
    <a class="card" href="./1024/">
      <div class="icon g1024">💻</div>
      <div><b>1024 程序员版</b><span>修完 Bug · 让项目上线</span></div>
    </a>
  </div>
  <footer>materin-tech.github.io/game</footer>
</body>
</html>

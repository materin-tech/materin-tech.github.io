<?xml version="1.0" encoding="UTF-8"?>
<!--
  Materin · 格物致知 · 单色版（深色用）
  用于深色背景下的白色 logo
-->
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Materin">
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- 外圈 -->
    <circle cx="32" cy="32" r="26" stroke-width="1" opacity="0.4"/>

    <!-- 内圈 -->
    <circle cx="32" cy="32" r="18" stroke-width="1" opacity="0.5"/>

    <!-- 主路径 -->
    <g stroke-width="1.5">
      <line x1="32" y1="8"  x2="32" y2="32"/>
      <line x1="32" y1="32" x2="32" y2="56"/>
      <line x1="8"  y1="32" x2="32" y2="32"/>
      <line x1="32" y1="32" x2="56" y2="32"/>
    </g>

    <!-- 次路径 -->
    <g stroke-width="0.8" opacity="0.5">
      <line x1="32" y1="8"  x2="56" y2="32"/>
      <line x1="56" y1="32" x2="32" y2="56"/>
      <line x1="32" y1="56" x2="8"  y2="32"/>
      <line x1="8"  y1="32" x2="32" y2="8"/>
    </g>

    <!-- 节点 -->
    <g fill="currentColor" stroke="none">
      <circle cx="32" cy="8"  r="2.5"/>
      <circle cx="32" cy="56" r="2.5"/>
      <circle cx="8"  cy="32" r="2.5"/>
      <circle cx="56" cy="32" r="2.5"/>
      <circle cx="32" cy="32" r="4"/>
    </g>
  </g>
</svg>